# Check contract (same task NAMES as the self-hosted-cicd template): check:fast (L0) / check (L2) / ci (L3) / image.
# Tools expected on PATH: task, python3 (+ requirements-dev.txt), gitleaks, osv-scanner, semgrep, actionlint, zizmor,
# docker (image only), syft, grype.
version: "3"

includes:
  gates:
    taskfile: ./gates/Taskfile.gates.yml
    dir: .
    vars: {BASE_REF: '{{.BASE_REF}}'}

vars:
  BASE_REF: '{{.BASE_REF | default "origin/main"}}'
  IMAGE: '{{.IMAGE | default "parcel-quote:ci"}}'

tasks:
  # ---------- L0: agent loop (< 60 s) ----------
  check:fast:
    desc: Fast gate for AI agents (changed files + unit tests)
    vars:
      CHANGED:
        sh: git diff --name-only --diff-filter=ACMR {{.BASE_REF}} -- '*.py' | tr '\n' ' '
    cmds:
      - '[ -z "{{.CHANGED}}" ] || python3 -m ruff check {{.CHANGED}}'
      - python3 -m pytest -x -m "not integration"
      - task: gates:fast

  # ---------- L2: pre-push (< 2 min) ----------
  check:
    desc: Full local gate (same as CI minus integration tests and image)
    cmds:
      - task: lint
      - task: typecheck
      - task: test:unit
      - task: build
      - task: secrets
      - task: audit
      - task: sast
      - task: workflows
      - task: gates:deterministic

  lint:       { cmds: ["python3 -m ruff check ."] }
  typecheck:  { cmds: ["python3 -m mypy quotesvc"] }
  test:unit:
    cmds:
      - python3 -m coverage run -m pytest -m "not integration"
      - python3 -m coverage report --fail-under=75 > /dev/null
  build:      { cmds: ["python3 -m compileall -q quotesvc"] }
  secrets:
    desc: Secret scan of everything not yet on the base branch
    cmds: ["gitleaks git --redact --no-banner --log-opts='{{.BASE_REF}}..HEAD'"]
  audit:
    desc: Known-vulnerable dependencies (OSV)
    cmds: ["osv-scanner scan source --lockfile requirements.txt:requirements-dev.txt"]
  sast:
    desc: SAST with the repo's VENDORED ruleset (no rules fetched at runtime)
    cmds: ["semgrep scan --config .semgrep/ --error --metrics=off --quiet --disable-version-check --exclude gates"]
  workflows:
    cmds:
      - actionlint -config-file .github/actionlint.yaml .forgejo/workflows/*.yml
      - zizmor --offline .forgejo/workflows/*.yml

  # ---------- L3: server CI (< 10 min) ----------
  test:integration: { cmds: ['python3 -m pytest -m integration'] }
  ci:
    desc: Everything the server gate runs
    cmds:
      - task: check
      - task: test:integration
      - task: image
      - task: gates:server

  image:
    desc: Build the container image (no push), SBOM + vulnerability gate. SKIP_IMAGE=1 skips (no Docker approval).
    cmds:
      - |
        if [ "${SKIP_IMAGE:-0}" = "1" ]; then echo "image: SKIPPED (SKIP_IMAGE=1; live Docker build not approved in this environment)"; exit 0; fi
        docker buildx build --pull --load -t {{.IMAGE}} .
        syft {{.IMAGE}} -o spdx-json=sbom.spdx.json
        grype {{.IMAGE}} --fail-on high
