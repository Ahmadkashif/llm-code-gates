# Thin wrapper: all checks live in Taskfile.yml (self-hosted-cicd contract).
name: pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ci
    timeout-minutes: 30
    env:
      BASE_REF: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: task ci
        run: task ci BASE_REF="$BASE_REF"
