#    steps:
#      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
#        with: {fetch-depth: 0, persist-credentials: false}
#      - name: advisory LLM review (exits 0 by itself)
#        env:
#          GATES_JUDGE_API_KEY: ${{ secrets.GATES_REVIEW_KEY }}
#        run: python3 gates/render.py --stack python --judge local-8gb && task gates:llm-review BASE_REF="origin/${{ github.base_ref }}"
#
# Option (a) — the same env line inside the `ci` job: simplest, but it breaks #3's "no secrets in the ci lane"
# rule; any PR branch can read the key. Only for a rate-limited, review-only, low-value key.
